<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">AI Mission Control — choose an authorization decision</title><desc id="desc">Illustrative decision challenge. A customer requests another account’s order. The model proposes lookup_order. Choose Allow, Verify authorization, or Escalate using the Markdown links.</desc>
<defs><radialGradient id="glow" cx="90%" cy="0%" r="90%"><stop stop-color="#14364D"/><stop offset="1" stop-color="#080F1D"/></radialGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#A5D9FF" stroke-opacity=".045"/></pattern></defs>
<rect width="800" height="500" rx="28" fill="url(#glow)"/><rect width="800" height="500" rx="28" fill="url(#grid)"/><rect x="1" y="1" width="798" height="498" rx="27" fill="none" stroke="#263A50"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="48" y="65" fill="#69DFFF" font-size="30" font-weight="700" >AI MISSION CONTROL</text><text x="48" y="131" fill="#F4F8FF" font-size="46" font-weight="700" >The agent wants to act.</text><text x="48" y="181" fill="#F4F8FF" font-size="42" font-weight="700" >You own the decision.</text><rect x="48" y="214" width="704" height="149" rx="18" fill="#101E31" stroke="#263A50"/><text x="72" y="257" fill="#B3C4D7" font-size="24" font-weight="600" >CUSTOMER REQUEST</text><text x="72" y="304" fill="#F4F8FF" font-size="38" font-weight="400" >“Show me order 5521.”</text><text x="72" y="342" fill="#B3C4D7" font-size="28" font-weight="400" >The session does not own this order.</text><text x="48" y="412" fill="#69DFFF" font-size="31" font-weight="500" >Proposed tool: lookup_order</text><text x="48" y="462" fill="#B3C4D7" font-size="28" font-weight="400" >Choose your response in the links below.</text></g></svg>
