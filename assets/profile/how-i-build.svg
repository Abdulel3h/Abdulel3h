<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" role="img" aria-labelledby="title desc">
<title id="title">How I build AI</title><desc id="desc">Understand the user; design the workflow; bound the model; authorize in code; evaluate behavior; ship a usable product.</desc>
<defs><radialGradient id="glow" cx="90%" cy="0%" r="90%"><stop stop-color="#14364D"/><stop offset="1" stop-color="#080F1D"/></radialGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#A5D9FF" stroke-opacity=".045"/></pattern></defs>
<rect width="800" height="760" rx="28" fill="url(#glow)"/><rect width="800" height="760" rx="28" fill="url(#grid)"/><rect x="1" y="1" width="798" height="758" rx="27" fill="none" stroke="#263A50"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="48" y="66" fill="#69DFFF" font-size="30" font-weight="700" >HOW I BUILD AI</text><text x="48" y="138" fill="#69DFFF" font-size="26" font-weight="600" >01</text><text x="110" y="138" fill="#F4F8FF" font-size="34" font-weight="600" >Understand the user</text><text x="110" y="177" fill="#B3C4D7" font-size="25" font-weight="400" >Start with the task and its consequences.</text><path d="M62 152V196" stroke="#263A50" stroke-width="2"/><text x="48" y="243" fill="#69DFFF" font-size="26" font-weight="600" >02</text><text x="110" y="243" fill="#F4F8FF" font-size="34" font-weight="600" >Design the workflow</text><text x="110" y="282" fill="#B3C4D7" font-size="25" font-weight="400" >Make the useful path clear.</text><path d="M62 257V301" stroke="#263A50" stroke-width="2"/><text x="48" y="348" fill="#69DFFF" font-size="26" font-weight="600" >03</text><text x="110" y="348" fill="#F4F8FF" font-size="34" font-weight="600" >Bound the model</text><text x="110" y="387" fill="#B3C4D7" font-size="25" font-weight="400" >Give it explicit tools and contracts.</text><path d="M62 362V406" stroke="#263A50" stroke-width="2"/><text x="48" y="453" fill="#69DFFF" font-size="26" font-weight="600" >04</text><text x="110" y="453" fill="#F4F8FF" font-size="34" font-weight="600" >Authorize in code</text><text x="110" y="492" fill="#B3C4D7" font-size="25" font-weight="400" >Check identity, ownership and consent.</text><path d="M62 467V511" stroke="#263A50" stroke-width="2"/><text x="48" y="558" fill="#69DFFF" font-size="26" font-weight="600" >05</text><text x="110" y="558" fill="#F4F8FF" font-size="34" font-weight="600" >Evaluate behavior</text><text x="110" y="597" fill="#B3C4D7" font-size="25" font-weight="400" >Inspect failures as well as passes.</text><path d="M62 572V616" stroke="#263A50" stroke-width="2"/><text x="48" y="663" fill="#69DFFF" font-size="26" font-weight="600" >06</text><text x="110" y="663" fill="#F4F8FF" font-size="34" font-weight="600" >Ship a usable product</text><text x="110" y="702" fill="#B3C4D7" font-size="25" font-weight="400" >Make limits and recovery understandable.</text></g></svg>
