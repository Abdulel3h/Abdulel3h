<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img" aria-labelledby="t d">
  <title id="t">Four engineered layers: experience, application, intelligence, infrastructure</title>
  <desc id="d">Portrait version: four chunky translucent slabs stacked in depth and threaded by a glass spine that carries light down through every layer.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#46F6FF"/><stop offset=".40" stop-color="#22E3C5"/>
      <stop offset=".76" stop-color="#C8FF54"/><stop offset="1" stop-color="#3B65FF"/>
    </linearGradient>
    <linearGradient id="glassBack" x1="1" y1="0" x2="0" y2="1">
      <stop stop-color="#22E3C5"/><stop offset=".55" stop-color="#3B65FF"/>
      <stop offset="1" stop-color="#1B3E8F"/>
    </linearGradient>
    <linearGradient id="glassLime" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#22E3C5"/><stop offset=".55" stop-color="#C8FF54"/>
      <stop offset="1" stop-color="#EFFFC9"/>
    </linearGradient>
    <linearGradient id="glassCold" x1="0" y1="0" x2=".6" y2="1">
      <stop stop-color="#E8FBFF"/><stop offset=".45" stop-color="#46F6FF" stop-opacity=".92"/>
      <stop offset="1" stop-color="#3B65FF"/>
    </linearGradient>
    <linearGradient id="inkFade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F4FFF9"/><stop offset=".62" stop-color="#22E3C5"/><stop offset="1" stop-color="#46F6FF"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22E3C5" stop-opacity=".55"/><stop offset="1" stop-color="#22E3C5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22E3C5" stop-opacity="0"/><stop offset=".3" stop-color="#22E3C5" stop-opacity=".8"/>
      <stop offset=".7" stop-color="#C8FF54"/><stop offset="1" stop-color="#46F6FF"/>
    </linearGradient>
    <radialGradient id="core" cx="36%" cy="30%" r="70%">
      <stop stop-color="#FFFFFF"/><stop offset=".18" stop-color="#46F6FF"/>
      <stop offset=".58" stop-color="#22E3C5"/><stop offset="1" stop-color="#3B65FF" stop-opacity=".9"/>
    </radialGradient>
    <radialGradient id="coreLime" cx="36%" cy="30%" r="70%">
      <stop stop-color="#FFFFFF"/><stop offset=".2" stop-color="#C8FF54"/>
      <stop offset=".62" stop-color="#22E3C5"/><stop offset="1" stop-color="#17705F"/>
    </radialGradient>
    <radialGradient id="haze">
      <stop stop-color="#22E3C5" stop-opacity=".26"/><stop offset=".55" stop-color="#22E3C5" stop-opacity=".08"/>
      <stop offset="1" stop-color="#22E3C5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hazeLime">
      <stop stop-color="#C8FF54" stop-opacity=".30"/><stop offset="1" stop-color="#C8FF54" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="78%">
      <stop stop-color="#06100E"/><stop offset=".55" stop-color="#040B09"/><stop offset="1" stop-color="#030706"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop stop-color="#0E4B43" stop-opacity=".85"/><stop offset="1" stop-color="#0E4B43" stop-opacity="0"/>
    </radialGradient>
    <filter id="glossL" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="bump"/>
      <feDiffuseLighting in="bump" surfaceScale="7.50" diffuseConstant="1.15" lighting-color="#CFEFFF" result="dif">
        <feDistantLight azimuth="228" elevation="48"/>
      </feDiffuseLighting>
      <feComposite in="dif" in2="SourceAlpha" operator="in" result="difc"/>
      <feBlend in="SourceGraphic" in2="difc" mode="multiply" result="mul"/>
      <feComposite in="mul" in2="SourceGraphic" operator="arithmetic" k2=".72" k3=".38" result="shaded"/>
      <feOffset in="SourceAlpha" dx="7.0" dy="7.7" result="ro"/>
      <feComposite in="SourceAlpha" in2="ro" operator="out" result="rmask"/>
      <feGaussianBlur in="rmask" stdDeviation="3.85" result="rsoft"/>
      <feFlood flood-color="#46F6FF" flood-opacity=".9" result="rcol"/>
      <feComposite in="rcol" in2="rsoft" operator="in" result="rim0"/>
      <feComposite in="rim0" in2="SourceAlpha" operator="in" result="rim"/>
      <feComposite in="rim" in2="shaded" operator="arithmetic" k2=".72" k3="1" result="base"/>
      <feSpecularLighting in="bump" surfaceScale="11.25" specularConstant="0.82" specularExponent="26" lighting-color="#EAFEFF" result="spec">
        <feDistantLight azimuth="228" elevation="58"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specc"/>
      <feComposite in="specc" in2="base" operator="arithmetic" k2="1" k3="1"/>
    </filter>
    <filter id="glossM" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="bump"/>
      <feDiffuseLighting in="bump" surfaceScale="5.00" diffuseConstant="1.15" lighting-color="#CFEFFF" result="dif">
        <feDistantLight azimuth="228" elevation="48"/>
      </feDiffuseLighting>
      <feComposite in="dif" in2="SourceAlpha" operator="in" result="difc"/>
      <feBlend in="SourceGraphic" in2="difc" mode="multiply" result="mul"/>
      <feComposite in="mul" in2="SourceGraphic" operator="arithmetic" k2=".72" k3=".38" result="shaded"/>
      <feOffset in="SourceAlpha" dx="5.0" dy="5.5" result="ro"/>
      <feComposite in="SourceAlpha" in2="ro" operator="out" result="rmask"/>
      <feGaussianBlur in="rmask" stdDeviation="2.75" result="rsoft"/>
      <feFlood flood-color="#46F6FF" flood-opacity=".9" result="rcol"/>
      <feComposite in="rcol" in2="rsoft" operator="in" result="rim0"/>
      <feComposite in="rim0" in2="SourceAlpha" operator="in" result="rim"/>
      <feComposite in="rim" in2="shaded" operator="arithmetic" k2=".72" k3="1" result="base"/>
      <feSpecularLighting in="bump" surfaceScale="7.50" specularConstant="0.9" specularExponent="34" lighting-color="#EAFEFF" result="spec">
        <feDistantLight azimuth="228" elevation="58"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specc"/>
      <feComposite in="specc" in2="base" operator="arithmetic" k2="1" k3="1"/>
    </filter>
    <filter id="glossS" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="bump"/>
      <feDiffuseLighting in="bump" surfaceScale="3.00" diffuseConstant="1.15" lighting-color="#CFEFFF" result="dif">
        <feDistantLight azimuth="228" elevation="48"/>
      </feDiffuseLighting>
      <feComposite in="dif" in2="SourceAlpha" operator="in" result="difc"/>
      <feBlend in="SourceGraphic" in2="difc" mode="multiply" result="mul"/>
      <feComposite in="mul" in2="SourceGraphic" operator="arithmetic" k2=".72" k3=".38" result="shaded"/>
      <feOffset in="SourceAlpha" dx="3.0" dy="3.3" result="ro"/>
      <feComposite in="SourceAlpha" in2="ro" operator="out" result="rmask"/>
      <feGaussianBlur in="rmask" stdDeviation="1.65" result="rsoft"/>
      <feFlood flood-color="#46F6FF" flood-opacity=".9" result="rcol"/>
      <feComposite in="rcol" in2="rsoft" operator="in" result="rim0"/>
      <feComposite in="rim0" in2="SourceAlpha" operator="in" result="rim"/>
      <feComposite in="rim" in2="shaded" operator="arithmetic" k2=".72" k3="1" result="base"/>
      <feSpecularLighting in="bump" surfaceScale="4.50" specularConstant="1.0" specularExponent="44" lighting-color="#EAFEFF" result="spec">
        <feDistantLight azimuth="228" elevation="58"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specc"/>
      <feComposite in="specc" in2="base" operator="arithmetic" k2="1" k3="1"/>
    </filter>
    <filter id="shade" x="-70%" y="-140%" width="240%" height="380%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="bloomS" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="frost" x="-15%" y="-40%" width="130%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="17" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer>
    </filter>
  </defs>
  <style>
    .s { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, monospace; }
    .eyebrow { letter-spacing: .22em; }
    .track { letter-spacing: .12em; }
    .still { display: none; }
    .mv { transform-box: fill-box; transform-origin: 50% 50%; }
    .cascade { offset-path: path("M330 190V870"); offset-rotate: 0deg; offset-distance: 0%; opacity: 0; animation: cascade 5.4s 1 both; }
    .slab { animation: slabIn 5.4s 1 both; }
    .slab-0 { animation-delay: 0.000s; }
    .slab-1 { animation-delay: 0.270s; }
    .slab-2 { animation-delay: 0.405s; }
    .slab-3 { animation-delay: 0.675s; }
    @keyframes cascade { 0% { offset-distance: 0%; opacity: 0; animation-timing-function: steps(12); } 30% { offset-distance: 4%; opacity: 0; animation-timing-function: steps(2); } 35% { offset-distance: 12%; opacity: 1; animation-timing-function: steps(11); } 62.5% { offset-distance: 52%; opacity: 1; animation-timing-function: steps(11); } 90% { offset-distance: 100%; opacity: 1; animation-timing-function: steps(4); } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes slabIn { 0% { opacity: .62; transform: translateY(-9px); animation-timing-function: steps(14); } 35% { opacity: 1; transform: translateY(0); animation-timing-function: steps(1); } 100% { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .motion { display: none !important; }
      .still { display: inline !important; }
    }
  </style>
  <rect width="760" height="900" rx="26" fill="url(#vignette)"/>
  <rect x=".75" y=".75" width="758.5" height="898.5" rx="25.25" fill="none" stroke="#123029" stroke-width="1.5"/>
  <text class="m eyebrow" x="60" y="50" font-size="15" fill="#5E7A74" font-weight="500">Product layers</text>
  <text class="m eyebrow" x="700" y="50" font-size="15" fill="#5E7A74" font-weight="500" text-anchor="end">03</text>
  <text class="s" x="56" y="126" font-size="40" fill="#F4FFF9" font-weight="700">One product.</text>
  <text class="s" x="56" y="178" font-size="40" fill="url(#inkFade)" font-weight="700">Four engineered layers.</text>
  <ellipse cx="330" cy="490" rx="330" ry="340" fill="url(#haze)" opacity=".45"/>
  <ellipse cx="330" cy="858" rx="260.4" ry="27.3" fill="url(#pool)" opacity=".5"/><ellipse cx="330" cy="858" rx="168" ry="13" fill="#010403" opacity="0.8" filter="url(#shade)"/>
  <path d="M330 190V870" stroke="#0C3A33" stroke-width="18" stroke-linecap="round"/>
  <path d="M330 190V870" stroke="url(#glass)" stroke-width="7" stroke-linecap="round" opacity=".45"/>
  <g class="mv slab slab-0"><g filter="url(#glossL)" opacity="0.82"><path d="M330 222L480 300L480 330L330 408L180 330L180 300Z" fill="url(#glassCold)"/><path d="M330 222L480 300L330 378L180 300Z" fill="#EAFFFB" opacity=".22"/><path d="M480 300L480 330L330 408L330 378Z" fill="#02110E" opacity=".35"/></g></g><text class="s" x="524" y="310" font-size="26" fill="#F4FFF9" font-weight="600">Experience</text><g class="mv slab slab-1"><g filter="url(#glossL)" opacity="0.77"><path d="M330 362L480 440L480 470L330 548L180 470L180 440Z" fill="url(#glass)"/><path d="M330 362L480 440L330 518L180 440Z" fill="#EAFFFB" opacity=".22"/><path d="M480 440L480 470L330 548L330 518Z" fill="#02110E" opacity=".35"/></g></g><text class="s" x="524" y="450" font-size="26" fill="#F4FFF9" font-weight="600">Application</text><g class="mv slab slab-2"><g filter="url(#glossL)" opacity="0.72"><path d="M330 502L480 580L480 610L330 688L180 610L180 580Z" fill="url(#glassLime)"/><path d="M330 502L480 580L330 658L180 580Z" fill="#EAFFFB" opacity=".22"/><path d="M480 580L480 610L330 688L330 658Z" fill="#02110E" opacity=".35"/></g></g><text class="s" x="524" y="590" font-size="26" fill="#F4FFF9" font-weight="600">Intelligence</text><g class="mv slab slab-3"><g filter="url(#glossL)" opacity="0.67"><path d="M330 642L480 720L480 750L330 828L180 750L180 720Z" fill="url(#glassBack)"/><path d="M330 642L480 720L330 798L180 720Z" fill="#EAFFFB" opacity=".22"/><path d="M480 720L480 750L330 828L330 798Z" fill="#02110E" opacity=".35"/></g></g><text class="s" x="524" y="730" font-size="26" fill="#F4FFF9" font-weight="600">Infrastructure</text>
  <g class="motion"><circle class="cascade" r="9" fill="#C8FF54" filter="url(#bloomS)"/></g>
  <rect width="760" height="900" rx="26" filter="url(#grain)" opacity="0.55" pointer-events="none"/>
</svg>
