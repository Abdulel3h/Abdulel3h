<rect width="400" height="150" rx="10" fill="#101310"/>
<text x="24" y="35" font-size="18" font-weight="400" style="fill:#b3bbaa">DIFFERENT OWNER</text><text x="24" y="77" font-size="27" font-weight="700">No permission. No action.</text><path d="M24 111H224" stroke="#3e4938" stroke-width="3" /><path d="M230 92L230 130" stroke="#edb7a0" stroke-width="4" /><path d="M240 92L240 130" stroke="#edb7a0" stroke-width="4" /><text x="270" y="119" font-size="20" font-weight="700" style="fill:#edb7a0">DENIED</text>
