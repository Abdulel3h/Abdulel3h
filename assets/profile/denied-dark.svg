<svg xmlns="http://www.w3.org/2000/svg" width="400" height="150" viewBox="0 0 400 150" role="img" aria-labelledby="title desc">
<title id="title">Different owner: denied. No return is created.</title><desc id="desc">Illustrative ownership denial. The model request cannot grant access to someone else’s order.</desc>
