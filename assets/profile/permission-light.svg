<svg xmlns="http://www.w3.org/2000/svg" width="800" height="222" viewBox="0 0 800 222" role="img" aria-labelledby="title desc">
<title id="title">The permission moment: propose, authorize, act.</title><desc id="desc">Illustrative Raqmi return request. A signal pauses at an application-controlled authorization boundary before proceeding. Ownership and explicit return consent are required. This is a design illustration, not live execution.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#20251e}.signal{animation:pass 4.6s ease-in-out 1 both}@keyframes pass{0%{transform:translateX(-710px)}35%,60%{transform:translateX(-352px)}100%{transform:translateX(0)}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style>
<rect width="800" height="222" rx="10" fill="#f4f2ea"/>
<text x="30" y="37" font-size="26" font-weight="400" style="fill:#535b4b">THE PERMISSION MOMENT</text><text x="30" y="91" font-size="38" font-weight="700">“Return my order.”</text><path d="M42 143H752" stroke="#bfc5b5" stroke-width="3" /><path d="M393 121L393 165" stroke="#435c18" stroke-width="3" /><path d="M407 121L407 165" stroke="#435c18" stroke-width="3" /><circle cx="42" cy="143" r="6" fill="#435c18"/><circle cx="752" cy="143" r="6" fill="#435c18"/><circle class="signal" cx="752" cy="143" r="7" fill="#435c18"/><text x="30" y="192" font-size="28" font-weight="400">PROPOSE</text><text x="400" y="192" font-size="28" font-weight="400" text-anchor="middle">AUTHORIZE</text><text x="768" y="192" font-size="28" font-weight="400" text-anchor="end">ACT</text>
</svg>