<svg xmlns="http://www.w3.org/2000/svg" width="400" height="184" viewBox="0 0 400 184" role="img" aria-labelledby="title desc">
<title id="title">The permission moment: propose, authorize, act.</title><desc id="desc">Illustrative Raqmi return request. A signal pauses at an application-controlled authorization boundary before proceeding. Ownership and explicit return consent are required. This is a design illustration, not live execution.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#20251e}.signal{animation:pass 4.6s ease-in-out 1 both}@keyframes pass{0%{transform:translateX(-331px)}35%,60%{transform:translateX(-171px)}100%{transform:translateX(0)}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style>
<rect width="400" height="184" rx="10" fill="#f4f2ea"/>
<text x="22" y="29" font-size="17" font-weight="400" style="fill:#535b4b">THE PERMISSION MOMENT</text><text x="22" y="69" font-size="26" font-weight="700">“Return my order.”</text><path d="M35 111H366" stroke="#bfc5b5" stroke-width="3" /><path d="M188 89L188 133" stroke="#435c18" stroke-width="3" /><path d="M202 89L202 133" stroke="#435c18" stroke-width="3" /><circle cx="35" cy="111" r="6" fill="#435c18"/><circle cx="366" cy="111" r="6" fill="#435c18"/><circle class="signal" cx="366" cy="111" r="7" fill="#435c18"/><text x="22" y="153" font-size="18" font-weight="400">PROPOSE</text><text x="195" y="153" font-size="18" font-weight="400" text-anchor="middle">AUTHORIZE</text><text x="376" y="153" font-size="18" font-weight="400" text-anchor="end">ACT</text>
</svg>