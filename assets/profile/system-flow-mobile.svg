<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="t d">
  <title id="t">Accountable agent flow: intent, reason, authorize, act, verify</title>
  <desc id="d">Portrait version: one translucent conduit carries an illuminated signal down through intent, reason, authorize, act and verify. The signal halts at the cold authorization monolith.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#46F6FF"/><stop offset=".40" stop-color="#22E3C5"/>
      <stop offset=".76" stop-color="#C8FF54"/><stop offset="1" stop-color="#3B65FF"/>
    </linearGradient>
    <linearGradient id="glassBack" x1="1" y1="0" x2="0" y2="1">
      <stop stop-color="#22E3C5"/><stop offset=".55" stop-color="#3B65FF"/>
      <stop offset="1" stop-color="#1B3E8F"/>
    </linearGradient>
    <linearGradient id="glassLime" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#22E3C5"/><stop offset=".55" stop-color="#C8FF54"/>
      <stop offset="1" stop-color="#EFFFC9"/>
    </linearGradient>
    <linearGradient id="glassCold" x1="0" y1="0" x2=".6" y2="1">
      <stop stop-color="#E8FBFF"/><stop offset=".45" stop-color="#46F6FF" stop-opacity=".92"/>
      <stop offset="1" stop-color="#3B65FF"/>
    </linearGradient>
    <linearGradient id="inkFade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F4FFF9"/><stop offset=".62" stop-color="#22E3C5"/><stop offset="1" stop-color="#46F6FF"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22E3C5" stop-opacity=".55"/><stop offset="1" stop-color="#22E3C5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22E3C5" stop-opacity="0"/><stop offset=".3" stop-color="#22E3C5" stop-opacity=".8"/>
      <stop offset=".7" stop-color="#C8FF54"/><stop offset="1" stop-color="#46F6FF"/>
    </linearGradient>
    <radialGradient id="core" cx="36%" cy="30%" r="70%">
      <stop stop-color="#FFFFFF"/><stop offset=".18" stop-color="#46F6FF"/>
      <stop offset=".58" stop-color="#22E3C5"/><stop offset="1" stop-color="#3B65FF" stop-opacity=".9"/>
    </radialGradient>
    <radialGradient id="coreLime" cx="36%" cy="30%" r="70%">
      <stop stop-color="#FFFFFF"/><stop offset=".2" stop-color="#C8FF54"/>
      <stop offset=".62" stop-color="#22E3C5"/><stop offset="1" stop-color="#17705F"/>
    </radialGradient>
    <radialGradient id="haze">
      <stop stop-color="#22E3C5" stop-opacity=".26"/><stop offset=".55" stop-color="#22E3C5" stop-opacity=".08"/>
      <stop offset="1" stop-color="#22E3C5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hazeLime">
      <stop stop-color="#C8FF54" stop-opacity=".30"/><stop offset="1" stop-color="#C8FF54" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="78%">
      <stop stop-color="#06100E"/><stop offset=".55" stop-color="#040B09"/><stop offset="1" stop-color="#030706"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop stop-color="#0E4B43" stop-opacity=".85"/><stop offset="1" stop-color="#0E4B43" stop-opacity="0"/>
    </radialGradient>
    <filter id="glossL" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="bump"/>
      <feDiffuseLighting in="bump" surfaceScale="7.50" diffuseConstant="1.15" lighting-color="#CFEFFF" result="dif">
        <feDistantLight azimuth="228" elevation="48"/>
      </feDiffuseLighting>
      <feComposite in="dif" in2="SourceAlpha" operator="in" result="difc"/>
      <feBlend in="SourceGraphic" in2="difc" mode="multiply" result="mul"/>
      <feComposite in="mul" in2="SourceGraphic" operator="arithmetic" k2=".72" k3=".38" result="shaded"/>
      <feOffset in="SourceAlpha" dx="7.0" dy="7.7" result="ro"/>
      <feComposite in="SourceAlpha" in2="ro" operator="out" result="rmask"/>
      <feGaussianBlur in="rmask" stdDeviation="3.85" result="rsoft"/>
      <feFlood flood-color="#46F6FF" flood-opacity=".9" result="rcol"/>
      <feComposite in="rcol" in2="rsoft" operator="in" result="rim0"/>
      <feComposite in="rim0" in2="SourceAlpha" operator="in" result="rim"/>
      <feComposite in="rim" in2="shaded" operator="arithmetic" k2=".72" k3="1" result="base"/>
      <feSpecularLighting in="bump" surfaceScale="11.25" specularConstant="0.82" specularExponent="26" lighting-color="#EAFEFF" result="spec">
        <feDistantLight azimuth="228" elevation="58"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specc"/>
      <feComposite in="specc" in2="base" operator="arithmetic" k2="1" k3="1"/>
    </filter>
    <filter id="glossM" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="bump"/>
      <feDiffuseLighting in="bump" surfaceScale="5.00" diffuseConstant="1.15" lighting-color="#CFEFFF" result="dif">
        <feDistantLight azimuth="228" elevation="48"/>
      </feDiffuseLighting>
      <feComposite in="dif" in2="SourceAlpha" operator="in" result="difc"/>
      <feBlend in="SourceGraphic" in2="difc" mode="multiply" result="mul"/>
      <feComposite in="mul" in2="SourceGraphic" operator="arithmetic" k2=".72" k3=".38" result="shaded"/>
      <feOffset in="SourceAlpha" dx="5.0" dy="5.5" result="ro"/>
      <feComposite in="SourceAlpha" in2="ro" operator="out" result="rmask"/>
      <feGaussianBlur in="rmask" stdDeviation="2.75" result="rsoft"/>
      <feFlood flood-color="#46F6FF" flood-opacity=".9" result="rcol"/>
      <feComposite in="rcol" in2="rsoft" operator="in" result="rim0"/>
      <feComposite in="rim0" in2="SourceAlpha" operator="in" result="rim"/>
      <feComposite in="rim" in2="shaded" operator="arithmetic" k2=".72" k3="1" result="base"/>
      <feSpecularLighting in="bump" surfaceScale="7.50" specularConstant="0.9" specularExponent="34" lighting-color="#EAFEFF" result="spec">
        <feDistantLight azimuth="228" elevation="58"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specc"/>
      <feComposite in="specc" in2="base" operator="arithmetic" k2="1" k3="1"/>
    </filter>
    <filter id="glossS" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="bump"/>
      <feDiffuseLighting in="bump" surfaceScale="3.00" diffuseConstant="1.15" lighting-color="#CFEFFF" result="dif">
        <feDistantLight azimuth="228" elevation="48"/>
      </feDiffuseLighting>
      <feComposite in="dif" in2="SourceAlpha" operator="in" result="difc"/>
      <feBlend in="SourceGraphic" in2="difc" mode="multiply" result="mul"/>
      <feComposite in="mul" in2="SourceGraphic" operator="arithmetic" k2=".72" k3=".38" result="shaded"/>
      <feOffset in="SourceAlpha" dx="3.0" dy="3.3" result="ro"/>
      <feComposite in="SourceAlpha" in2="ro" operator="out" result="rmask"/>
      <feGaussianBlur in="rmask" stdDeviation="1.65" result="rsoft"/>
      <feFlood flood-color="#46F6FF" flood-opacity=".9" result="rcol"/>
      <feComposite in="rcol" in2="rsoft" operator="in" result="rim0"/>
      <feComposite in="rim0" in2="SourceAlpha" operator="in" result="rim"/>
      <feComposite in="rim" in2="shaded" operator="arithmetic" k2=".72" k3="1" result="base"/>
      <feSpecularLighting in="bump" surfaceScale="4.50" specularConstant="1.0" specularExponent="44" lighting-color="#EAFEFF" result="spec">
        <feDistantLight azimuth="228" elevation="58"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specc"/>
      <feComposite in="specc" in2="base" operator="arithmetic" k2="1" k3="1"/>
    </filter>
    <filter id="shade" x="-70%" y="-140%" width="240%" height="380%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="bloomS" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="frost" x="-15%" y="-40%" width="130%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="17" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer>
    </filter>
  </defs>
  <style>
    .s { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, monospace; }
    .eyebrow { letter-spacing: .22em; }
    .track { letter-spacing: .12em; }
    .still { display: none; }
    .mv { transform-box: fill-box; transform-origin: 50% 50%; }
    .signal { offset-path: path("M262 236C222 298 302 322 262 384S222 470 262 532S302 618 262 680S222 766 262 828"); offset-rotate: 0deg; offset-distance: 0%; opacity: 0; animation: flowSignal 12s infinite; }
    .seam { animation: seam 12s infinite; }
    .pulse { animation: stagePulse 12s infinite; }
    .pulse-0 { animation-delay: 0.200s; }
    .pulse-1 { animation-delay: 1.800s; }
    .pulse-3 { animation-delay: 8.200s; }
    .pulse-4 { animation-delay: 10.400s; }
    @keyframes flowSignal { 0% { offset-distance: 0%; opacity: 0; animation-timing-function: steps(2); } 3.333% { offset-distance: 2%; opacity: 1; animation-timing-function: steps(16); } 30% { offset-distance: 49%; opacity: 1; animation-timing-function: steps(1); } 43.33% { offset-distance: 49%; opacity: 1; animation-timing-function: steps(2); } 46.67% { offset-distance: 49%; opacity: .3; animation-timing-function: steps(3); } 51.67% { offset-distance: 53%; opacity: 1; animation-timing-function: steps(21); } 86.67% { offset-distance: 100%; opacity: 1; animation-timing-function: steps(1); } 91.67% { offset-distance: 100%; opacity: 1; animation-timing-function: steps(5); } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes seam { 0% { opacity: .45; animation-timing-function: steps(1); } 28.33% { opacity: .45; animation-timing-function: steps(5); } 36.67% { opacity: 1; animation-timing-function: steps(1); } 53.33% { opacity: 1; animation-timing-function: steps(5); } 61.67% { opacity: .5; animation-timing-function: steps(23); } 100% { opacity: .45; } }
    @keyframes stagePulse { 0% { opacity: 0; transform: scale(1); animation-timing-function: steps(2); } 3.333% { opacity: .75; transform: scale(1.4); animation-timing-function: steps(3); } 8.333% { opacity: 0; transform: scale(1.75); animation-timing-function: steps(1); } 100% { opacity: 0; transform: scale(1.75); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .motion { display: none !important; }
      .still { display: inline !important; }
    }
  </style>
  <rect width="760" height="980" rx="26" fill="url(#vignette)"/>
  <rect x=".75" y=".75" width="758.5" height="978.5" rx="25.25" fill="none" stroke="#123029" stroke-width="1.5"/>
  <text class="m eyebrow" x="60" y="50" font-size="15" fill="#5E7A74" font-weight="500">Accountable agent flow</text>
  <text class="m eyebrow" x="700" y="50" font-size="15" fill="#5E7A74" font-weight="500" text-anchor="end">02</text>
  <text class="s" x="56" y="122" font-size="38" fill="#F4FFF9" font-weight="700">The model proposes.</text>
  <text class="s" x="56" y="172" font-size="38" fill="url(#inkFade)" font-weight="700">The application decides.</text>
  <ellipse cx="262" cy="532" rx="300" ry="400" fill="url(#haze)" opacity=".45"/>
  <path d="M262 236C222 298 302 322 262 384S222 470 262 532S302 618 262 680S222 766 262 828" fill="none" stroke="#061F1A" stroke-width="46" stroke-linecap="round"/>
  <g filter="url(#glossM)" opacity="0.68"><path d="M262 236C222 298 302 322 262 384S222 470 262 532S302 618 262 680S222 766 262 828" fill="none" stroke="url(#glass)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="motion"><circle class="signal" r="13" fill="#C8FF54" filter="url(#bloomS)"/><circle class="signal" r="5.85" fill="#FFFFFF"/></g>
  <g class="still"><circle cx="232" cy="428" r="13" fill="#C8FF54" filter="url(#bloomS)"/></g>
  <g filter="url(#glossM)" opacity="0.95"><circle cx="262" cy="236" r="30" fill="url(#core)"/></g><g class="motion"><circle class="mv pulse pulse-0" cx="262" cy="236" r="44" fill="none" stroke="#46F6FF" stroke-width="2.5" filter="url(#bloomS)" opacity="0"/></g><text class="m eyebrow" x="400" y="228" font-size="20" fill="#5E7A74" font-weight="500">01</text><text class="s track" x="400" y="264" font-size="34" fill="#F4FFF9" font-weight="600">Intent</text><g filter="url(#glossM)" opacity="0.95"><circle cx="262" cy="384" r="30" fill="url(#core)"/></g><g class="motion"><circle class="mv pulse pulse-1" cx="262" cy="384" r="44" fill="none" stroke="#46F6FF" stroke-width="2.5" filter="url(#bloomS)" opacity="0"/></g><text class="m eyebrow" x="400" y="376" font-size="20" fill="#5E7A74" font-weight="500">02</text><text class="s track" x="400" y="412" font-size="34" fill="#F4FFF9" font-weight="600">Reason</text><text class="m eyebrow" x="400" y="524" font-size="20" fill="#5E7A74" font-weight="500">03</text><text class="s track" x="400" y="560" font-size="34" fill="#C8FF54" font-weight="600">Authorize</text><g filter="url(#glossM)" opacity="0.95"><circle cx="262" cy="680" r="30" fill="url(#core)"/></g><g class="motion"><circle class="mv pulse pulse-3" cx="262" cy="680" r="44" fill="none" stroke="#46F6FF" stroke-width="2.5" filter="url(#bloomS)" opacity="0"/></g><text class="m eyebrow" x="400" y="672" font-size="20" fill="#5E7A74" font-weight="500">04</text><text class="s track" x="400" y="708" font-size="34" fill="#F4FFF9" font-weight="600">Act</text><g filter="url(#glossM)" opacity="0.95"><circle cx="262" cy="828" r="30" fill="url(#core)"/></g><g class="motion"><circle class="mv pulse pulse-4" cx="262" cy="828" r="44" fill="none" stroke="#46F6FF" stroke-width="2.5" filter="url(#bloomS)" opacity="0"/></g><text class="m eyebrow" x="400" y="820" font-size="20" fill="#5E7A74" font-weight="500">05</text><text class="s track" x="400" y="856" font-size="34" fill="#F4FFF9" font-weight="600">Verify</text>
  <g transform="translate(262 532) scale(0.78) rotate(90)">
    <ellipse rx="128" ry="104" fill="url(#hazeLime)" opacity=".45"/>
    <g filter="url(#glossL)" opacity=".96">
      <rect x="-70" y="-72" width="56" height="144" rx="22" fill="url(#glassCold)"/>
      <rect x="14" y="-72" width="56" height="144" rx="22" fill="url(#glassCold)"/>
    </g>
    <g filter="url(#glossS)" opacity=".7">
      <rect x="-76" y="-88" width="152" height="17" rx="8.5" fill="url(#glassCold)"/>
      <rect x="-76" y="71" width="152" height="17" rx="8.5" fill="url(#glassCold)"/>
    </g>
    <g class="seam" opacity=".45">
      <path d="M-8-58V58" stroke="#C8FF54" stroke-width="13" stroke-linecap="round" filter="url(#bloomS)"/>
      <path d="M-8-58V58" stroke="#F4FFF9" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  <rect width="760" height="980" rx="26" filter="url(#grain)" opacity="0.55" pointer-events="none"/>
