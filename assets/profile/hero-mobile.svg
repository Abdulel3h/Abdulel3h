<svg xmlns="http://www.w3.org/2000/svg" width="760" height="860" viewBox="0 0 760 860" role="img" aria-labelledby="t d">
  <title id="t">Abdulelah Alkhathami — I engineer AI systems that think, act, and earn trust.</title>
  <desc id="d">Portrait version of the hero: a sculptural translucent letter A holding a luminous core inside a tilted glass orbit ring, above the statement and the practice areas.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#46F6FF"/><stop offset=".40" stop-color="#22E3C5"/>
      <stop offset=".76" stop-color="#C8FF54"/><stop offset="1" stop-color="#3B65FF"/>
    </linearGradient>
    <linearGradient id="glassBack" x1="1" y1="0" x2="0" y2="1">
      <stop stop-color="#22E3C5"/><stop offset=".55" stop-color="#3B65FF"/>
      <stop offset="1" stop-color="#1B3E8F"/>
    </linearGradient>
    <linearGradient id="glassLime" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#22E3C5"/><stop offset=".55" stop-color="#C8FF54"/>
      <stop offset="1" stop-color="#EFFFC9"/>
    </linearGradient>
    <linearGradient id="glassCold" x1="0" y1="0" x2=".6" y2="1">
      <stop stop-color="#E8FBFF"/><stop offset=".45" stop-color="#46F6FF" stop-opacity=".92"/>
      <stop offset="1" stop-color="#3B65FF"/>
    </linearGradient>
    <linearGradient id="inkFade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F4FFF9"/><stop offset=".62" stop-color="#22E3C5"/><stop offset="1" stop-color="#46F6FF"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22E3C5" stop-opacity=".55"/><stop offset="1" stop-color="#22E3C5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22E3C5" stop-opacity="0"/><stop offset=".3" stop-color="#22E3C5" stop-opacity=".8"/>
      <stop offset=".7" stop-color="#C8FF54"/><stop offset="1" stop-color="#46F6FF"/>
    </linearGradient>
    <radialGradient id="core" cx="36%" cy="30%" r="70%">
      <stop stop-color="#FFFFFF"/><stop offset=".18" stop-color="#46F6FF"/>
      <stop offset=".58" stop-color="#22E3C5"/><stop offset="1" stop-color="#3B65FF" stop-opacity=".9"/>
    </radialGradient>
    <radialGradient id="coreLime" cx="36%" cy="30%" r="70%">
      <stop stop-color="#FFFFFF"/><stop offset=".2" stop-color="#C8FF54"/>
      <stop offset=".62" stop-color="#22E3C5"/><stop offset="1" stop-color="#17705F"/>
    </radialGradient>
    <radialGradient id="haze">
      <stop stop-color="#22E3C5" stop-opacity=".26"/><stop offset=".55" stop-color="#22E3C5" stop-opacity=".08"/>
      <stop offset="1" stop-color="#22E3C5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hazeLime">
      <stop stop-color="#C8FF54" stop-opacity=".30"/><stop offset="1" stop-color="#C8FF54" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="78%">
      <stop stop-color="#06100E"/><stop offset=".55" stop-color="#040B09"/><stop offset="1" stop-color="#030706"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop stop-color="#0E4B43" stop-opacity=".85"/><stop offset="1" stop-color="#0E4B43" stop-opacity="0"/>
    </radialGradient>
    <filter id="glossL" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="bump"/>
      <feDiffuseLighting in="bump" surfaceScale="7.50" diffuseConstant="1.15" lighting-color="#CFEFFF" result="dif">
        <feDistantLight azimuth="228" elevation="48"/>
      </feDiffuseLighting>
      <feComposite in="dif" in2="SourceAlpha" operator="in" result="difc"/>
      <feBlend in="SourceGraphic" in2="difc" mode="multiply" result="mul"/>
      <feComposite in="mul" in2="SourceGraphic" operator="arithmetic" k2=".72" k3=".38" result="shaded"/>
      <feOffset in="SourceAlpha" dx="7.0" dy="7.7" result="ro"/>
      <feComposite in="SourceAlpha" in2="ro" operator="out" result="rmask"/>
      <feGaussianBlur in="rmask" stdDeviation="3.85" result="rsoft"/>
      <feFlood flood-color="#46F6FF" flood-opacity=".9" result="rcol"/>
      <feComposite in="rcol" in2="rsoft" operator="in" result="rim0"/>
      <feComposite in="rim0" in2="SourceAlpha" operator="in" result="rim"/>
      <feComposite in="rim" in2="shaded" operator="arithmetic" k2=".72" k3="1" result="base"/>
      <feSpecularLighting in="bump" surfaceScale="11.25" specularConstant="0.82" specularExponent="26" lighting-color="#EAFEFF" result="spec">
        <feDistantLight azimuth="228" elevation="58"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specc"/>
      <feComposite in="specc" in2="base" operator="arithmetic" k2="1" k3="1"/>
    </filter>
    <filter id="glossM" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="bump"/>
      <feDiffuseLighting in="bump" surfaceScale="5.00" diffuseConstant="1.15" lighting-color="#CFEFFF" result="dif">
        <feDistantLight azimuth="228" elevation="48"/>
      </feDiffuseLighting>
      <feComposite in="dif" in2="SourceAlpha" operator="in" result="difc"/>
      <feBlend in="SourceGraphic" in2="difc" mode="multiply" result="mul"/>
      <feComposite in="mul" in2="SourceGraphic" operator="arithmetic" k2=".72" k3=".38" result="shaded"/>
      <feOffset in="SourceAlpha" dx="5.0" dy="5.5" result="ro"/>
      <feComposite in="SourceAlpha" in2="ro" operator="out" result="rmask"/>
      <feGaussianBlur in="rmask" stdDeviation="2.75" result="rsoft"/>
      <feFlood flood-color="#46F6FF" flood-opacity=".9" result="rcol"/>
      <feComposite in="rcol" in2="rsoft" operator="in" result="rim0"/>
      <feComposite in="rim0" in2="SourceAlpha" operator="in" result="rim"/>
      <feComposite in="rim" in2="shaded" operator="arithmetic" k2=".72" k3="1" result="base"/>
      <feSpecularLighting in="bump" surfaceScale="7.50" specularConstant="0.9" specularExponent="34" lighting-color="#EAFEFF" result="spec">
        <feDistantLight azimuth="228" elevation="58"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specc"/>
      <feComposite in="specc" in2="base" operator="arithmetic" k2="1" k3="1"/>
    </filter>
    <filter id="glossS" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="bump"/>
      <feDiffuseLighting in="bump" surfaceScale="3.00" diffuseConstant="1.15" lighting-color="#CFEFFF" result="dif">
        <feDistantLight azimuth="228" elevation="48"/>
      </feDiffuseLighting>
      <feComposite in="dif" in2="SourceAlpha" operator="in" result="difc"/>
      <feBlend in="SourceGraphic" in2="difc" mode="multiply" result="mul"/>
      <feComposite in="mul" in2="SourceGraphic" operator="arithmetic" k2=".72" k3=".38" result="shaded"/>
      <feOffset in="SourceAlpha" dx="3.0" dy="3.3" result="ro"/>
      <feComposite in="SourceAlpha" in2="ro" operator="out" result="rmask"/>
      <feGaussianBlur in="rmask" stdDeviation="1.65" result="rsoft"/>
      <feFlood flood-color="#46F6FF" flood-opacity=".9" result="rcol"/>
      <feComposite in="rcol" in2="rsoft" operator="in" result="rim0"/>
      <feComposite in="rim0" in2="SourceAlpha" operator="in" result="rim"/>
      <feComposite in="rim" in2="shaded" operator="arithmetic" k2=".72" k3="1" result="base"/>
      <feSpecularLighting in="bump" surfaceScale="4.50" specularConstant="1.0" specularExponent="44" lighting-color="#EAFEFF" result="spec">
        <feDistantLight azimuth="228" elevation="58"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specc"/>
      <feComposite in="specc" in2="base" operator="arithmetic" k2="1" k3="1"/>
    </filter>
    <filter id="shade" x="-70%" y="-140%" width="240%" height="380%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="bloomS" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="frost" x="-15%" y="-40%" width="130%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="17" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer>
    </filter>
  </defs>
  <style>
    .s { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, monospace; }
    .eyebrow { letter-spacing: .22em; }
    .track { letter-spacing: .12em; }
    .still { display: none; }
    .mv { transform-box: fill-box; transform-origin: 50% 50%; }
    .hero-form { animation: heroFloat 12s infinite; }
    .hero-sat { animation: heroSat 12s infinite; }
    .hero-haze { animation: heroHaze 12s infinite; }
    .orbit-back { offset-path: path("M-248 0A248 98 0 0 1 248 0"); offset-rotate: 0deg; offset-distance: 0%; opacity: 0; animation: orbitBack 12s infinite; }
    .orbit-front { offset-path: path("M248 0A248 98 0 0 1 -248 0"); offset-rotate: 0deg; offset-distance: 0%; opacity: 0; animation: orbitFront 12s infinite; }
    @keyframes heroFloat { 0% { transform: translate(0, 0) rotate(0deg); animation-timing-function: steps(30); } 50% { transform: translate(0, -9px) rotate(.5deg); animation-timing-function: steps(30); } 100% { transform: translate(0, 0) rotate(0deg); } }
    @keyframes heroSat { 0% { transform: translate(0, 0); animation-timing-function: steps(30); } 50% { transform: translate(-4px, 7px); animation-timing-function: steps(30); } 100% { transform: translate(0, 0); } }
    @keyframes heroHaze { 0% { opacity: .55; animation-timing-function: steps(30); } 50% { opacity: 1; animation-timing-function: steps(30); } 100% { opacity: .55; } }
    @keyframes orbitBack { 0% { offset-distance: 0%; opacity: 0; animation-timing-function: steps(2); } 3.333% { offset-distance: 4%; opacity: 1; animation-timing-function: steps(27); } 48.33% { offset-distance: 100%; opacity: 1; animation-timing-function: steps(1); } 50% { offset-distance: 100%; opacity: 0; animation-timing-function: steps(1); } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes orbitFront { 0% { offset-distance: 0%; opacity: 0; animation-timing-function: steps(1); } 50% { offset-distance: 0%; opacity: 0; animation-timing-function: steps(2); } 53.33% { offset-distance: 4%; opacity: 1; animation-timing-function: steps(26); } 96.67% { offset-distance: 100%; opacity: 1; animation-timing-function: steps(2); } 100% { offset-distance: 100%; opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .motion { display: none !important; }
      .still { display: inline !important; }
    }
  </style>
  <rect width="760" height="860" rx="26" fill="url(#vignette)"/>
  <rect x=".75" y=".75" width="758.5" height="858.5" rx="25.25" fill="none" stroke="#123029" stroke-width="1.5"/>
  <text class="m eyebrow" x="60" y="50" font-size="15" fill="#5E7A74" font-weight="500">Abdulelah Alkhathami</text>
  <text class="m eyebrow" x="700" y="50" font-size="15" fill="#5E7A74" font-weight="500" text-anchor="end">01</text>
  <g transform="translate(380 286) scale(0.72)">
    <ellipse cy="10" rx="300" ry="250" fill="url(#haze)" class="hero-haze" opacity=".55"/>
    <ellipse cx="-98" cy="214" rx="96.1" ry="18.9" fill="url(#pool)" opacity=".5"/><ellipse cx="-98" cy="214" rx="62" ry="9" fill="#010403" opacity="0.9" filter="url(#shade)"/>
    <ellipse cx="96" cy="214" rx="96.1" ry="18.9" fill="url(#pool)" opacity=".5"/><ellipse cx="96" cy="214" rx="62" ry="9" fill="#010403" opacity="0.9" filter="url(#shade)"/>
    <g transform="translate(0 30) rotate(-15)"><g filter="url(#glossM)" opacity="0.74"><path d="M-248 0A248 98 0 0 1 248 0" fill="none" stroke="url(#glassBack)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path d="M-248 0A248 98 0 0 1 248 0" fill="none" stroke="#F2FFFC" stroke-width="7.8" stroke-linecap="round" opacity=".14" transform="translate(-2.7 -3.3)"/></g><g class="motion"><circle class="orbit-back" r="7" fill="#C8FF54" filter="url(#bloomS)"/><circle class="orbit-back" r="3" fill="#FFFFFF"/></g></g>
  </g>
  <g transform="translate(380 286) scale(0.72)">
    <g class="mv hero-form">
      <g filter="url(#glossL)" opacity="0.9"><path d="M-116 196C-104 76-66-66-8-186C48-66 96 76 110 196" fill="none" stroke="url(#glass)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/><path d="M-116 196C-104 76-66-66-8-186C48-66 96 76 110 196" fill="none" stroke="#F2FFFC" stroke-width="16.1" stroke-linecap="round" opacity=".14" transform="translate(-5.6 -6.8)"/></g>
      <g filter="url(#glossM)" opacity="1"><circle cx="4" cy="-18" r="36" fill="url(#core)"/></g>
      <g filter="url(#glossM)" opacity="0.72"><path d="M-80 44C-30 26 42 26 92 42" fill="none" stroke="url(#glassLime)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/><path d="M-80 44C-30 26 42 26 92 42" fill="none" stroke="#F2FFFC" stroke-width="9.9" stroke-linecap="round" opacity=".14" transform="translate(-3.4 -4.2)"/></g>
    </g>
    <g transform="translate(0 30) rotate(-15)"><g filter="url(#glossM)" opacity="0.82"><path d="M248 0A248 98 0 0 1 -248 0" fill="none" stroke="url(#glass)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><path d="M248 0A248 98 0 0 1 -248 0" fill="none" stroke="#F2FFFC" stroke-width="8.8" stroke-linecap="round" opacity=".14" transform="translate(-3.1 -3.7)"/></g><g class="motion"><circle class="orbit-front" r="7" fill="#C8FF54" filter="url(#bloomS)"/><circle class="orbit-front" r="3" fill="#FFFFFF"/></g></g>
    <g class="mv hero-sat">
      <g filter="url(#glossS)" opacity="0.95"><circle cx="202" cy="-70" r="19" fill="url(#coreLime)"/></g>
      <g filter="url(#glossS)" opacity="0.9"><circle cx="-214" cy="104" r="13" fill="url(#core)"/></g>
    </g>
    <g class="still"><circle cx="-150" cy="86" r="7" fill="#C8FF54" filter="url(#bloomS)"/></g>
  </g>
  <text class="m eyebrow" x="56" y="566" font-size="24" fill="#22E3C5" font-weight="600">AI systems engineering</text>
  <text class="s" x="56" y="646" font-size="62" fill="#F4FFF9" font-weight="700" letter-spacing="-1.6">I engineer AI</text>
  <text class="s" x="56" y="706" font-size="46" fill="#F4FFF9" font-weight="600" letter-spacing="-1">systems that think,</text>
  <text class="s" x="56" y="764" font-size="46" fill="url(#inkFade)" font-weight="700" letter-spacing="-1">act, and earn trust.</text>
  <path d="M58 800H520" stroke="url(#hair)" stroke-width="1.5"/>
  <text class="s" x="56" y="834" font-size="22" fill="#C3D8D2">AI Agents · Voice AI · RAG · Product Engineering</text>
  <rect width="760" height="860" rx="26" filter="url(#grain)" opacity="0.55" pointer-events="none"/>
</svg>
