<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">B Observability</title><desc id="desc">Exploratory visual direction for the GitHub profile redesign. Superseded by the final responsive artwork.</desc><rect width="800" height="420" fill="#071219"/><text x="30" y="42" fill="#8dd8e8" font-family="Arial, sans-serif" font-size="24" font-weight="400">ABDULELAH / SYSTEMS IN VIEW</text><text x="30" y="111" fill="#edece6" font-family="Arial, sans-serif" font-size="52" font-weight="700">From intent to action.</text><rect x="30" y="150" width="740" height="226" fill="#0e202a" stroke="#254353"/><text x="52" y="191" fill="#9ab6c2" font-family="Arial, sans-serif" font-size="20" font-weight="400">ILLUSTRATIVE TRACE / RAQMI</text><text x="52" y="241" fill="#edece6" font-family="Arial, sans-serif" font-size="26" font-weight="400">01  User       Return my order</text><text x="52" y="291" fill="#edece6" font-family="Arial, sans-serif" font-size="26" font-weight="400">02  Policy     Check ownership</text><text x="52" y="341" fill="#8dd8e8" font-family="Arial, sans-serif" font-size="26" font-weight="400">03  Action     Require consent</text></svg>